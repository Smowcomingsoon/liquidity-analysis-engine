name: Secret scan

# The repository is public (16/10): no key, email, server IP or other personal
# data may land in it. gitleaks reads .gitleaks.toml and fails the run on any
# finding; the deploy workflow is separate, so a finding never stops the site.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar xzf gl.tgz gitleaks && rm gl.tgz && sudo mv gitleaks /usr/local/bin/

      - name: Scan the files
        run: gitleaks dir . --no-banner --redact -c .gitleaks.toml

      - name: Scan the new commits
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          range=""
          if [ -n "$BASE" ]; then range="$BASE..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then range="$BEFORE..HEAD"
          fi
          [ -z "$range" ] && { echo "no commit range, files already scanned"; exit 0; }
          gitleaks git . --no-banner --redact -c .gitleaks.toml --log-opts="$range"
