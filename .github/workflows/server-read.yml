name: Server read (layers)

# Read-only look at what the layer engine found on the server (Lorenzo,
# 01/10: "vai con l'action"): the engine's own store and the layer rows of
# the project database, opened read-only. Nothing is written. Run by hand.

on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Layer engine state
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            # Standard library only: importing the app in a second process
            # is killed for memory (exit 137).
            docker exec -i deploy-app-1 python - <<'PY'
            import glob, json, sqlite3, time
            base = next(d for d in ("/srv/backend/data", "/app/backend/data", "backend/data", "data")
                        if glob.glob(d + "/onchain_projects.db"))
            try:
                s = json.load(open(base + "/onchain_layers.json"))
            except OSError:
                s = {"last_run": 0, "found": {}}
            print("last_run", time.strftime("%Y-%m-%d %H:%M", time.gmtime(s["last_run"])) if s.get("last_run") else "never")
            for gid, x in sorted((s.get("found") or {}).items(), key=lambda kv: -(kv[1].get("score") or 0)):
                print("found", gid, x.get("type"), x.get("status"), x.get("score"), (x.get("cex") or {}).get("pair"), x.get("why") or "")
            db = sqlite3.connect(f"file:{base}/onchain_projects.db?mode=ro", uri=True)
            for r in db.execute("SELECT token, symbol, status, score, mcap, rank, why FROM projects WHERE chain = 'layer' ORDER BY score DESC"):
                print("db", *r)
            PY
