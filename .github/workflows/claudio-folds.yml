name: Claudio 4H, every year as the unseen one

on:
  workflow_dispatch:
    inputs:
      pairs:
        description: 'JSON list of pairs (empty = the 15 of the basket)'
        required: false
        default: ''
      tf:
        description: '4h or 1d'
        required: false
        default: '4h'
      set:
        description: 'variant set (empty = default, btc = every strategy with and without the BTC filter)'
        required: false
        default: ''
      filters:
        description: 'SET=regimes only: comma-separated filter suffixes to run (e.g. " w21x")'
        required: false
        default: ''

jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PAIRS: ${{ inputs.pairs || '["BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT","COMPUSDT","BATUSDT","1INCHUSDT","KSMUSDT","SNXUSDT","ROSEUSDT","ZILUSDT","ANKRUSDT","CELOUSDT","IOTXUSDT","KAVAUSDT"]' }}
    strategy:
      fail-fast: false
      matrix:
        # 4 large caps, 5 around rank 150-250, 6 around 300-490 (rank printed
        # by the job, CoinPaprika)
        chunk: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      # One job per 7th of the pairs, not one per pair: every job pays the
      # setup and is billed rounded up to the minute (35 jobs ~ 70+ minutes).
      - run: |
          cd backend; rc=0
          for PAIR in $(python -c "import json,os; print(' '.join(json.loads(os.environ['PAIRS'])[${{ matrix.chunk }}::7]))"); do
            echo "::group::$PAIR"
            PAIR=$PAIR TF=${{ inputs.tf || '4h' }} SET=${{ inputs.set }} FILTERS="${{ inputs.filters }}" PYTHONPATH=. python ../scripts/compare_claudio_folds.py || { echo "::error::$PAIR failed"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: folds-${{ matrix.chunk }}
          path: backend/folds-*.json
          if-no-files-found: ignore
