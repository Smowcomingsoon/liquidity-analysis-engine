name: Quantitative engine checks
on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/static/onchain/**'
      - 'frontend/tests/**'
      - '.github/workflows/quant-tests.yml'
concurrency:
  group: quant-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quant:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r backend/requirements.txt pytest ruff
      - run: python -m ruff check backend --select E,F,W --ignore E501
      - run: python -m pytest backend/tests/test_quant_engine.py backend/tests/test_quant_integration.py backend/tests/test_quant_observatory.py backend/tests/test_autotrader.py backend/tests/test_sim_wallet.py -q
        env:
          PYTHONPATH: backend
      - run: node --test frontend/tests/agent-map.test.mjs frontend/tests/lab-shown.test.mjs
