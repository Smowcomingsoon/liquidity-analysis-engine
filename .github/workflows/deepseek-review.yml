# DeepSeek reads every pull request and leaves one comment (replaced on each
# push). Needs the repository secret DEEPSEEK_API_KEY; without it, it skips.
name: DeepSeek review

on:
  pull_request:
    types: [opened, reopened, ready_for_review]   # not on every push: ~1 min each

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: deepseek-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/deepseek_review.py
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
