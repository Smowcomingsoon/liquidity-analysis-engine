name: Drawing tools (browser)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/static/draw-engine.js'
      - 'frontend/static/app.js'
      - 'scripts/e2e/**'
      - '.github/workflows/draw-e2e.yml'
  workflow_dispatch:

concurrency:
  group: draw-e2e
  cancel-in-progress: true

jobs:
  # Drawing tools in a real browser (scripts/e2e/draw.e2e.mjs): only when the
  # drawing code or its test changes; never a gate for the deploy.
  draw-e2e:
    name: Drawing tools (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0 && npx playwright install --with-deps chromium
      - run: |
          set -o pipefail
          node scripts/e2e/draw.e2e.mjs 2>&1 | tee /tmp/e2e.log || {
            grep -E '^FAIL|Error' /tmp/e2e.log | head -20 | sed 's/^/::error::/'; exit 1; }

