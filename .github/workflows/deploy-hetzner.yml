name: Deploy to Hetzner

# Stesso patto che c'era con Fly: si spinge su main e va in produzione da
# solo. Cambia solo dove atterra.
#
# Il lint resta il cancello prima del deploy, e i test adesso ci sono
# accanto: su Fly giravano solo i controlli di stile, e per giorni sette
# test sono rimasti rossi su main senza che nessuno lo sapesse, perche' la
# pipeline era verde. Un deploy che non sa se il codice funziona non e' un
# cancello, e' una porta aperta.

on:
  push:
    branches: [main]
    # Notes-only commits change nothing on the server: no build, no minutes.
    paths-ignore:
      - '**.md'
      - 'design/**'
  workflow_dispatch:

jobs:
  verify:
    name: Lint e test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'   # obbligatorio: pandas-ta non si installa su 3.11
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Lint
        run: |
          pip install ruff
          ruff check backend/ --select E,F,W --ignore E501

      - name: Frontend
        run: |
          node --check frontend/static/app.js
          node --check frontend/static/draw-engine.js
          node --test frontend/tests/draw-engine.test.mjs

      - name: Test
        run: |
          pip install -r backend/requirements.txt pytest
          cd backend
          # Failures also become annotations: they are readable from the
          # public check-runs API, the raw log is not.
          set -o pipefail
          PYTHONPATH=. python -m pytest tests/ -q -rfE 2>&1 | tee /tmp/pytest.log || {
            grep -E '^(FAILED|ERROR) ' /tmp/pytest.log | head -20 | sed 's/^/::error::/'
            grep -E '^E  ' /tmp/pytest.log | head -20 | sed 's/^/::error::/'
            exit 1; }

  # Drawing tools in a real browser (scripts/e2e/draw.e2e.mjs): reported on
  # every push, not a gate for the deploy, so a slow runner cannot block it.
  draw-e2e:
    name: Drawing tools (browser)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.0 && npx playwright install --with-deps chromium
      - run: |
          set -o pipefail
          node scripts/e2e/draw.e2e.mjs 2>&1 | tee /tmp/e2e.log || {
            grep -E '^FAIL|Error' /tmp/e2e.log | head -20 | sed 's/^/::error::/'; exit 1; }

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: verify
    concurrency: deploy-hetzner   # un deploy alla volta, mai due sovrapposti

    steps:
      - name: Collegati al server e aggiorna
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          # Una ricostruzione con le dipendenze puo' durare parecchi minuti
          # su due vCPU: meglio aspettare che tagliare a meta' un deploy.
          command_timeout: 30m
          script: |
            set -e
            cd /opt/liquidity
            git fetch --quiet origin main
            # Il commit che "verify" ha provato, non l'ultimo di main: con
            # due push ravvicinati origin/main puo' essere gia' un altro
            # (audit #347). Quello dopo arriva col suo deploy, in coda.
            git reset --hard ${{ github.sha }}
            cd deploy
            docker compose up -d --build
            # Il Caddyfile e' montato come volume: compose non vede che e'
            # cambiato e lascia Caddy con la configurazione vecchia. E'
            # successo davvero — le intestazioni di sicurezza nuove non sono
            # arrivate in produzione finche' non l'ho riavviato a mano.
            docker compose restart caddy
            # Le immagini vecchie riempiono i 40 GB del disco in qualche
            # decina di deploy: qui si buttano subito, non quando il disco
            # e' pieno e il sito non riparte.
            docker image prune -f

      - name: Verifica che risponda
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            # Il deploy non e' finito quando il container parte: e' finito
            # quando l'app risponde. Senza questo controllo un avvio fallito
            # risulterebbe comunque "deploy riuscito".
            for i in $(seq 1 30); do
              if docker exec deploy-app-1 python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)" 2>/dev/null; then
                echo "L'app risponde."
                exit 0
              fi
              sleep 10
            done
            echo "L'app non ha risposto entro cinque minuti." >&2
            docker compose -f /opt/liquidity/deploy/docker-compose.yml logs --tail 50 app >&2
            exit 1
