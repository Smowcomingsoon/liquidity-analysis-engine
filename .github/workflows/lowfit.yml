name: Low overfitting test (1D)

# On demand: scripts/lowfit_1d.py on every pair, results as check-run
# annotations (the sandbox cannot reach the exchanges).
on:
  workflow_dispatch:
    inputs:
      pairs:
        description: 'JSON list of pairs (empty = the 35 of the test environment)'
        required: false
        default: ''
      mode:
        description: 'empty = first run, v2 = narrow search + walk-forward judge + RSI+BB additions'
        required: false
        default: ''

jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PAIRS: ${{ inputs.pairs || '["BTCUSDT","ETHUSDT","SOLUSDT","XRPUSDT","COMPUSDT","BATUSDT","1INCHUSDT","KSMUSDT","SNXUSDT","ROSEUSDT","ZILUSDT","ANKRUSDT","CELOUSDT","IOTXUSDT","KAVAUSDT","LTCUSDT","LINKUSDT","ADAUSDT","DOGEUSDT","ATOMUSDT","XLMUSDT","ALGOUSDT","VETUSDT","CHZUSDT","ENJUSDT","BNBUSDT","TRXUSDT","ETCUSDT","EOSUSDT","NEOUSDT","DASHUSDT","ZECUSDT","XTZUSDT","ONTUSDT","QTUMUSDT"]' }}
    strategy:
      fail-fast: false
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      # One job per 7th of the pairs, not one per pair: every job pays the
      # setup and is billed rounded up to the minute (35 jobs ~ 70+ minutes).
      - run: |
          cd backend; rc=0
          for PAIR in $(python -c "import json,os; print(' '.join(json.loads(os.environ['PAIRS'])[${{ matrix.chunk }}::7]))"); do
            echo "::group::$PAIR"
            PAIR=$PAIR TF=1d MODE=${{ inputs.mode }} PYTHONPATH=. python ../scripts/lowfit_1d.py || { echo "::error::$PAIR failed"; rc=1; }
            echo "::endgroup::"
          done
          exit $rc
