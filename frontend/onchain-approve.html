<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Approve key reveal — Liquidity Engine</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: #0e1410; color: #eceae2;
    margin: 0; padding: 24px 18px 40px;
    display: flex; justify-content: center;
  }
  .card { max-width: 380px; width: 100%; }
  h1 { font-size: 18px; margin: 0 0 6px; }
  p.lead { color: #a2a596; font-size: 13.5px; margin: 0 0 22px; }
  label { display: block; font-size: 12.5px; color: #a2a596; margin: 14px 0 5px; }
  input {
    width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 8px;
    border: 1.5px solid #33352a; background: #1d1f17; color: #eceae2; font-size: 15px;
  }
  button {
    width: 100%; margin-top: 14px; padding: 11px; border-radius: 8px; border: none;
    background: #2fd696; color: #08150f; font-weight: 700; font-size: 14.5px; cursor: pointer;
  }
  button.secondary { background: transparent; color: #eceae2; border: 1.5px solid #33352a; }
  button:disabled { opacity: .5; cursor: default; }
  .warn {
    margin-top: 16px; padding: 10px 12px; border-radius: 8px; font-size: 12.5px;
    background: rgba(224,171,61,.14); color: #e0ab3d; border: 1px solid rgba(224,171,61,.35);
  }
  .msg { margin-top: 16px; font-size: 13.5px; }
  .msg.ok { color: #2fd696; }
  .msg.err { color: #ff5a6e; }
  .divider { display: flex; align-items: center; gap: 10px; margin: 22px 0 6px; color: #5c6158; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #33352a; }
  #password-form { display: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>Approve a key reveal</h1>
    <p class="lead">Someone is asking to see an on-chain wallet's private key from a browser. If that's you, confirm here.</p>

    <div class="warn">Only do this if you just scanned this QR from your own browser. If you didn't ask for anything, close this page.</div>

    <label for="email">Account email</label>
    <input id="email" type="email" autocomplete="username" required />

    <button id="passkey-btn" type="button">Face ID / Touch ID</button>

    <div class="divider">or</div>
    <button id="show-password-btn" type="button" class="secondary">Use password</button>

    <form id="password-form">
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" />
      <button type="submit">Approve with password</button>
    </form>

    <p id="msg" class="msg" hidden></p>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const token = params.get("token") || "";
  const msg = document.getElementById("msg");
  const emailInput = document.getElementById("email");
  const passkeyBtn = document.getElementById("passkey-btn");
  const showPasswordBtn = document.getElementById("show-password-btn");
  const passwordForm = document.getElementById("password-form");

  if (!token) {
    say("Link has no token. Scan the QR from your browser again.", "err");
    passkeyBtn.disabled = true;
    showPasswordBtn.disabled = true;
  }
  if (!window.PublicKeyCredential) {
    passkeyBtn.disabled = true;
    passkeyBtn.title = "This browser doesn't support passkeys";
  }

  function say(text, kind) {
    msg.hidden = false;
    msg.className = kind ? `msg ${kind}` : "msg";
    msg.textContent = text;
  }

  // Il JSON che il server manda (py_webauthn) e' nel formato standard
  // WebAuthn "JSON" (base64url per challenge/id) — i browser recenti lo
  // sanno decodificare da soli; quelli piu' vecchi restano fuori, non
  // c'e' un fallback manuale qui apposta (un solo percorso da fidarsi,
  // non due che possono disallinearsi).
  showPasswordBtn.addEventListener("click", () => {
    passwordForm.style.display = "block";
    passkeyBtn.style.display = "none";
    showPasswordBtn.style.display = "none";
  });

  passkeyBtn.addEventListener("click", async () => {
    const email = emailInput.value.trim();
    if (!email) { say("Enter the account email first.", "err"); return; }
    passkeyBtn.disabled = true;
    say("Fetching options…");
    try {
      const optResp = await fetch("/api/onchain/reveal/passkey/options", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });
      const optBody = await optResp.json().catch(() => ({}));
      if (!optResp.ok) throw new Error(optBody.detail || "No passkey for this email. Use your password.");

      say("Follow the Face ID / Touch ID prompt on your phone…");
      const requestOptions = PublicKeyCredential.parseRequestOptionsFromJSON(JSON.parse(optBody.options));
      const assertion = await navigator.credentials.get({ publicKey: requestOptions });

      say("Verifying…");
      const verResp = await fetch("/api/onchain/reveal/passkey/verify", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email, token, state_token: optBody.state_token, credential: assertion.toJSON(),
        }),
      });
      const verBody = await verResp.json().catch(() => ({}));
      if (!verResp.ok) throw new Error(verBody.detail || `Error ${verResp.status}`);
      say("Approved. Head back to the browser, the key is about to show up.", "ok");
      passkeyBtn.style.display = "none";
      showPasswordBtn.style.display = "none";
    } catch (err) {
      say(err.message || "Face ID/Touch ID failed. Use your password.", "err");
      passkeyBtn.disabled = false;
    }
  });

  passwordForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = passwordForm.querySelector("button");
    btn.disabled = true;
    say("Verifying…");
    try {
      const resp = await fetch("/api/onchain/reveal/approve", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          email: emailInput.value.trim(),
          password: document.getElementById("password").value,
          token,
        }),
      });
      const body = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(body.detail || `Error ${resp.status}`);
      say("Approved. Head back to the browser, the key is about to show up.", "ok");
      passwordForm.hidden = true;
    } catch (err) {
      say(err.message || "Network error.", "err");
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
